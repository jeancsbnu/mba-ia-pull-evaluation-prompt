    ### Exemplo 7 — BUG COMPLEXO (dashboard executivo / SaaS B2B com queries lentas, cache estale e exportação)

    Entrada:
    "Plataforma de marketing analytics com problemas de performance e dados desatualizados.

    CONTEXTO:
    SaaS B2B com 800+ empresas clientes, cada uma com 100-3000 usuários ativos.

    PROBLEMAS:

    1. PERFORMANCE - Query N+1 no dashboard de performance:
       - Endpoint: GET /api/analytics/marketing-dashboard
       - Para cada campanha, faz query separada para buscar métricas
       - 1 cliente com 80 campanhas = 81 queries
       - Tempo de resposta: 38 segundos (SLA: 3s)
       - Database CPU: 92% em horário de pico

    2. CACHE - ROAS exibido com dados antigos:
       - Cache TTL configurado para 6 horas
       - Empresas executam novas campanhas e veem ROAS desatualizado
       - Decisões de budget alocadas em campanhas mortas
       - Inconsistência entre dashboard e fonte de dados (Google Ads API)

    3. EXPORTAÇÃO - Download de relatório anual trava o servidor:
       - Botão 'Exportar relatório anual' gera CSV de 2GB
       - Faz tudo síncrono na memória
       - Outras requisições ficam em fila por 5 minutos
       - Servidor cai com OOM em alguns casos
       - Usuário não recebe feedback até final

    4. FORECASTING - Previsões de attribution inconsistentes:
       - Algoritmo de attribution usa diferentes janelas (7d, 30d) em diferentes views
       - VPs reclamam de 'números diferentes em todo lugar'

    IMPACTO:
    - 320+ executivos C-level afetados (CMOs, CFOs, VPs)
    - 12% das empresas cancelaram contratos por falta de confiabilidade
    - Perda anual estimada: R$ 1.8M em ARR"

    Saída:

    Como um usuário executivo (CEO, CFO, VP), eu quero acessar dashboards e relatórios gerenciais que sejam rápidos, precisos e consistentes em todas as fontes, para que eu possa confiar nos dados para tomada de decisão estratégica.

    === USER STORY PRINCIPAL ===

    Título: Plataforma de analytics confiável e performática para executivos

    Descrição:
    Como um usuário executivo (CEO, CFO, VP), eu quero acessar dashboards executivos e exportar relatórios gerenciais sem esperas longas nem dados inconsistentes, para que eu possa tomar decisões estratégicas baseadas em informações confiáveis.

    === CRITÉRIOS DE ACEITAÇÃO ===

    A. Performance - Dashboard carrega em menos de 3 segundos:
    - Dado que sou um executivo acessando o dashboard
    - Quando carrego GET /api/analytics/marketing-dashboard
    - Então a página deve carregar completamente em < 3 segundos
    - E o database CPU não deve ultrapassar 70% em horário de pico
    - E o tempo de resposta deve ser consistente independentemente do número de campanhas
    - E a UI deve mostrar skeleton loading durante o carregamento

    B. Cache Inteligente - Dados sempre atualizados para métricas críticas:
    - Dado que existe uma nova campanha lançada
    - Quando o executivo acessa o ROAS no dashboard
    - Então o dado deve refletir a campanha em até 5 minutos
    - E o cache deve ser invalidado por eventos (lançamento, pausa, edição)
    - E métricas críticas (ROAS, MRR, CAC) devem ter TTL curto (5min)
    - E métricas históricas (de 30+ dias) podem ter cache longo

    C. Exportação Assíncrona - Relatório anual sem travar servidor:
    - Dado que solicito a exportação de um relatório anual de 2GB
    - Quando clico em 'Exportar relatório anual'
    - Então a requisição deve retornar imediatamente (HTTP 202)
    - E a exportação deve ser processada de forma assíncrona em background
    - E outras requisições NÃO devem ser bloqueadas durante a exportação
    - E o usuário deve ser notificado por email ao concluir a exportação
    - E o link de download deve permanecer válido por 7 dias

    D. Forecasting Consistente - Attribution unificado:
    - Dado que visualizo previsões de attribution em diferentes telas
    - Quando comparo MRR forecast com pipeline forecast
    - Então ambos devem usar a MESMA janela de attribution (configurável)
    - E a janela ativa deve estar visível ao usuário
    - E mudanças na janela devem se propagar a todas as views

    === CRITÉRIOS TÉCNICOS ===

    Performance - Resolver N+1 com Eager Loading e Materialized Views:
    - Eager loading com JOIN para reduzir queries por campanha
    - Materialized views para métricas complexas (refresh incremental)
    - Índices compostos nas FKs mais usadas (campaign_id, account_id)
    - Reduzir N queries para queries agregadas

    Exemplo de query otimizada:
    ```sql
    CREATE MATERIALIZED VIEW campaign_metrics_mv AS
    SELECT campaign_id, account_id, SUM(spend) as total_spend, SUM(revenue) as total_revenue
    FROM events
    GROUP BY campaign_id, account_id;
    CREATE INDEX idx_metrics_account ON campaign_metrics_mv(account_id);
    ```

    Cache - Estratégia hierárquica com invalidação por eventos:
    - Cache hierárquico (sem cache / curto / longo): métricas críticas / médias / históricas
    - TTL curto (5min) para dados críticos (MRR, Active Users)
    - Cache invalidation automática via eventos
    - Eventos de upgrade/downgrade invalidam cache
    - Redis com pub/sub para invalidação distribuída

    Exportação - Job queue assíncrono com streaming:
    - Job queue (Sidekiq, Bull) para processamento background
    - Streaming de CSV (não carregar tudo na memória)
    - Limite de 1000 linhas por chunk
    - Notificação por email/webhook ao concluir
    - Upload do CSV final para S3 (link assinado válido por 7 dias)

    Exemplo de job:
    ```json
    {{
      "job_id": "export-uuid-v4",
      "user_id": 12345,
      "report_type": "annual",
      "year": 2026,
      "notification_email": "ceo@empresa.com",
      "callback_url": "/api/notifications/export-ready"
    }}
    ```

    Forecasting - Attribution unificado em service compartilhado:
    - Centralizar lógica de attribution em um único service
    - Window de attribution configurável por conta
    - Cache compartilhado para forecasts pré-calculados
    - Logs de auditoria em mudanças de janela

    === CONTEXTO DO BUG ===

    Severidade: CRÍTICA (Cancelamentos em curso, impacto financeiro direto)

    Impacto Business:
    - 320+ executivos C-level afetados
    - 12% das empresas cancelaram contratos
    - Perda anual estimada: R$ 1.8M em ARR

    Problemas Técnicos:
    1. Query N+1 em dashboard executivo (38s vs 3s SLA)
    2. Cache TTL longo (6h) causa dados desatualizados em métricas críticas
    3. Exportação síncrona bloqueia servidor (OOM em alguns casos)
    4. Algoritmos de attribution divergem entre telas

    === TASKS TÉCNICAS SUGERIDAS ===

    Fase 1 - Hotfix (3 dias):
    1. [PERF] Adicionar índices compostos em campaign_metrics
    2. [CACHE] Reduzir TTL de ROAS para 5 minutos
    3. [EXPORT] Migrar exportação anual para job queue

    Fase 2 - Core Fix (2 semanas):
    4. [PERF] Implementar materialized views com refresh incremental
    5. [CACHE] Cache hierárquico com invalidação por eventos
    6. [EXPORT] Streaming de CSV para S3 + notificação por email
    7. [FORECAST] Centralizar service de attribution

    Fase 3 - Robustez (2 semanas):
    8. [TESTS] Testes de carga com 1k contas concorrentes
    9. [MONITOR] Dashboard de performance e SLA tracking

    === MÉTRICAS DE SUCESSO ===

    Antes vs Depois:
    - Tempo dashboard executivo: 38s → < 3s
    - Database CPU pico: 92% → < 70%
    - Defasagem ROAS: até 6h → < 5min
    - Bloqueio durante exportação: 5min → 0
    - Cancelamentos por performance: 12% → < 2%

