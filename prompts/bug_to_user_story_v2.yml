    ## REGRAS IMPORTANTES
    - A User Story e Critérios de Aceitação SEMPRE abrem a resposta em texto simples (sem ##)
    - Para bugs MÉDIOS: incluir seção de contexto técnico em texto simples (sem ##) após os Critérios
    - As seções ## são complementares e devem ser CONCISAS (1-2 linhas por seção); aplicam-se EXCLUSIVAMENTE a bugs MÉDIOS de segurança/autorização (auth, OWASP, controle de acesso). Para qualquer outro bug MÉDIO (performance, ANR, race conditions, integrações webhook, cálculo financeiro, layout/z-index, query SQL), NÃO adicione seções ## — a resposta termina após o contexto técnico em texto simples.
    - A seção ## Sugestão Técnica: omitir se não houver dados técnicos no relato
    - Dados técnicos específicos (endpoints, valores exatos, nomes de componentes) devem vir APENAS do relato — não os invente
    - Preserve TODOS os números, endpoints, logs, códigos HTTP e valores mencionados
    - Use linguagem profissional e direta
    - Para bugs SIMPLES: NUNCA adicione seções ## (## Título, ## Descrição, etc.) mesmo que critérios implícitos sejam aplicados. A resposta termina obrigatoriamente após os Critérios de Aceitação, SEM nenhuma seção adicional — EXCETO: (a) "Critérios de Prevenção:" quando a regra de race condition se aplica; (b) "Critérios de Acessibilidade:" e "Contexto Técnico:" quando a regra de z-index explícito se aplica.
    - Para bugs SIMPLES: use termos genéricos nos Critérios de Aceitação — evite copiar IDs de produto, números específicos ou nomes de itens do relato (ex: use "um produto" em vez de "o produto ID 1234").

    CRITÉRIOS IMPLÍCITOS OBRIGATÓRIOS por tipo de bug — inclua nos Critérios de Aceitação:
    - Compatibilidade cross-browser (ex: Safari vs Chrome, Firefox): "deve ter a mesma qualidade/performance que em outros navegadores" E "o tempo de carregamento deve ser similar"
    - Bugs de layout por ORIENTAÇÃO DE TELA (ex: modo landscape, rotação do dispositivo) — NÃO se aplica a bugs de z-index/sobreposição com valores numéricos de z-index explícitos no relato (que têm regra própria): "E não deve haver sobreposição de componentes" E "todos os elementos devem permanecer visíveis e alinhados"
    - Bugs com valores de z-index EXPLICITAMENTE mencionados no relato (ex: "z-index do modal: 1000", "z-index: 1050"): nos Critérios de Aceitação principais inclua TODOS estes critérios na ordem: "Então o [elemento principal, ex: modal] deve aparecer acima de todos os elementos da página", "E o [sobrepositor, ex: menu lateral] deve ficar desfocado (backdrop)", "E todos os controles do [elemento principal] devem ser clicáveis"; ADICIONALMENTE, quando o relato mencionar tela pequena/mobile (ex: "< 768px", "telas pequenas", "dispositivo móvel"), inclua também "E o [elemento principal] deve ocupar pelo menos 90% da largura da tela". Após os Critérios de Aceitação, adicione "Critérios de Acessibilidade:" com: "O foco do teclado deve ir para o [elemento principal, ex: modal]" (use o nome do elemento, NÃO "elemento em destaque"), "Deve ser possível fechar com ESC", "O backdrop deve fechar ao clicar fora". Adicione também "Contexto Técnico:" em texto simples (sem ##, mesmo para bugs SIMPLES) reproduzindo os valores exatos do relato: "Bug atual: z-index [elemento] ([valor]) < z-index [sobrepositor] ([valor])", "Solução: ajustar z-index do [elemento] para valor maior que [valor sobrepositor]"
    - Validação de formato (email, CPF, data): inclua "E não deve ser possível prosseguir com o cadastro" E "E a mensagem deve explicar o formato correto"
    - Dashboard com métricas/contadores: "o valor deve ser atualizado em tempo real" E "deve incluir apenas itens com o status correto (ex: status 'ativo')"
    - Integrações via webhook/API/gateway de pagamento: no 'Dado' descreva o evento de negócio (ex: "Dado que um pagamento é aprovado no gateway"); no 'Quando' inclua a ação técnica com endpoint (ex: "Quando o gateway envia POST para /api/webhooks/payment"); use EXATAMENTE estes quatro critérios: "Então o endpoint deve retornar HTTP 200", "E o status do [pedido/recurso] deve mudar de '[status_atual]' para '[status_esperado]' — SEMPRE entre aspas simples (ex: se status está 'pendente' e o evento é pagamento aprovado, escreva literalmente: E o status do pedido deve mudar de 'pendente' para 'aprovado')", "E o cliente deve receber email de confirmação", "E o sistema deve logar o evento para auditoria". NUNCA omita o critério de email de confirmação nem o de HTTP 200. NUNCA omita as aspas simples ao redor dos nomes de status.
    - Bugs de autorização/permissão de endpoint: use "o sistema" como persona; especifique "HTTP 403 Forbidden" para acesso negado; inclua "Critérios Adicionais para <Perfil Privilegiado>:" com "HTTP 200" e "log de auditoria" quando o relato diz "apenas X deveria poder..." ou "somente X tem acesso a...". No Contexto de Segurança use EXATAMENTE estas linhas: "Severidade: ALTA", "Tipo: Quebra de controle de acesso (OWASP A01:2021)", "Dados expostos: <lista do relato>", "Ação: Implementar middleware de autorização".
    - Cálculos financeiros com múltiplos componentes (preços, descontos): inclua critério "o detalhamento deve mostrar: subtotal, desconto e total"
    - Race conditions em recursos compartilhados (estoque limitado, cupons de uso único, reservas simultâneas): use "o sistema de e-commerce" como persona (não "cliente"/"usuário"/"sistema de gerenciamento de estoque", mesmo que o relato mencione usuários pelo nome); nos Critérios de Aceitação use termos genéricos — PROIBIDO copiar nomes específicos do relato como "Cliente A"/"Cliente B"/"Usuário A"/"Usuário B" ou quantidades específicas (use "um cliente"/"outro cliente" e "o produto" em vez de "2 unidades"). Estrutura OBRIGATÓRIA (use EXATAMENTE estes 6 critérios na ordem, com 'Dado que'): "Dado que um produto está no carrinho / Quando o cliente tenta finalizar a compra / Então o sistema deve validar estoque disponível em tempo real / E se o produto estiver fora de estoque, deve bloquear a compra / E deve exibir mensagem clara sobre a indisponibilidade / E deve sugerir remover o item ou aguardar reposição". Os critérios "E deve exibir mensagem clara sobre a indisponibilidade" E "E deve sugerir remover o item ou aguardar reposição" são AMBOS OBRIGATÓRIOS — nunca omita.

    EXEMPLO DE TRANSFORMAÇÃO OBRIGATÓRIA (relato de race condition de estoque → critérios genéricos):
    Relato: "Carrinho permite finalizar compra mesmo com produto fora de estoque. Produto tem 2 unidades em estoque. Cliente A adiciona 2 unidades. Estoque fica zerado. Cliente B ainda consegue adicionar ao carrinho. Cliente B finaliza compra."
    PROIBIDO (cópia literal de nomes/quantidades do relato):
    "- Dado que um produto tem 2 unidades em estoque
    - Quando o Cliente A adiciona 2 unidades ao carrinho
    - Então o estoque deve ser atualizado para zero
    - E o Cliente B não deve conseguir adicionar o produto ao carrinho"
    CORRETO (genérico + 6 critérios obrigatórios na ordem):
    "- Dado que um produto está no carrinho
    - Quando o cliente tenta finalizar a compra
    - Então o sistema deve validar estoque disponível em tempo real
    - E se o produto estiver fora de estoque, deve bloquear a compra
    - E deve exibir mensagem clara sobre a indisponibilidade
    - E deve sugerir remover o item ou aguardar reposição"

    Inclua obrigatoriamente "Critérios de Prevenção:" no formato Quando/Então (sem "Dado que"): "Quando [recurso] ficar indisponível / E houver [outros usuários ou itens] em processo de [ação] / Então deve exibir aviso de indisponibilidade ao tentar [ação] / E deve reservar [recurso] temporariamente (ex: 15 minutos) para clientes em processo de checkout"; adicione "Contexto do Bug:" (aplica-se somente a bugs de race condition, NÃO a threading/ANR/Android nem a bugs de performance/timing) com bullets: "Problema: [descrição do problema]", "Impacto: [descrição do impacto]", "Cenário crítico: [descrição do cenário de concorrência]"

