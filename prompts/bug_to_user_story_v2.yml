    ### Exemplo 6 — BUG MÉDIO (autorização de endpoint)

    Entrada:
    "Falha de autorização na API: usuários comuns conseguem acessar dados de outros usuários.
    Detalhes:
    - Endpoint: GET /api/users/{{id}}
    - Comportamento atual: qualquer usuário autenticado obtém HTTP 200 ao acessar dados de outro usuário
    - Esperado: usuários comuns devem receber HTTP 403; apenas administradores podem acessar dados de todos
    - Dados expostos: nome, email, endereço e histórico de pedidos"

    Saída:

    Como o sistema de gestão de usuários, eu quero controlar o acesso aos dados de perfil por ID, para que informações pessoais sejam acessíveis apenas pelo próprio usuário ou por administradores autorizados.

    Critérios de Aceitação:
    - Dado que sou um usuário comum
    - Quando tento acessar GET /api/users/{{id}} de outro usuário
    - Então devo receber HTTP 403 Forbidden
    - E apenas devo poder acessar meus próprios dados
    - E administradores devem poder acessar dados de todos

    Critérios Adicionais para Administradores:
    - Dado que sou um administrador
    - Quando acesso GET /api/users/{{id}} de qualquer usuário
    - Então devo receber os dados completos com HTTP 200
    - E o acesso deve ser registrado em log de auditoria

    Contexto de Segurança:
    - Severidade: ALTA
    - Tipo: Quebra de controle de acesso (OWASP A01:2021)
    - Dados expostos: nome, email, endereço e histórico de pedidos
    - Ação: Implementar middleware de autorização

    ## Título
    Quebra de controle de acesso permite que usuários visualizem dados de outros via GET /api/users/{{id}}

    ## Descrição
    GET /api/users/{{id}} retorna HTTP 200 para qualquer usuário autenticado, expondo dados pessoais e histórico de pedidos de outros usuários.

    ## Problema Atual
    Usuário comum obtém HTTP 200 ao acessar GET /api/users/{{id}} de outro usuário, visualizando nome, email, endereço e histórico de pedidos.

    ## Comportamento Esperado
    Usuários comuns devem receber HTTP 403; administradores devem ter acesso completo com registro de auditoria.

    ## Passos para Reproduzir
    1. Autenticar como usuário comum
    2. Fazer requisição GET /api/users/{{id}} com ID de outro usuário
    3. Verificar que retorna HTTP 200 com dados completos

    ## Impacto / Severidade
    Crítico — exposição de dados pessoais (nome, email, endereço, histórico) de todos os usuários.

    ## Sugestão Técnica
    Implementar middleware de autorização verificando se o usuário logado é o dono do recurso ou tem papel de administrador antes de retornar os dados.

